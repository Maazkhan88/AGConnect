services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agconnect
      POSTGRES_USER: agconnect
      POSTGRES_PASSWORD: agconnect
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agconnect -d agconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: replace-in-production
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes: { postgres_data: {}, minio_data: {} }
